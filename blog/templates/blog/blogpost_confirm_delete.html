{% extends 'catalog/base.html' %}

{% block title %}Удалить статью{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Удалить статью?</h1>
    <p>Вы уверены, что хотите удалить «{{ object.title }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
