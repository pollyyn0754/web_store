<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <!-- Логотип -->
    <h5 class="my-0 me-md-auto font-weight-normal">Skystore</h5>

    <!-- Навигация -->
    <nav class="d-flex flex-column flex-md-row align-items-center mt-3 mt-md-0 ms-md-4 w-100 w-md-100 gap-2">

        <!-- ЛЕВАЯ ЧАСТЬ (основное меню) -->
        <div class="d-flex gap-2 me-md-auto w-100">
            <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:home' %}">Каталог</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts' %}">Контакты</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'blog:post_list' %}">Блог</a>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ (Профиль / Авторизация) -->
        <div class="d-flex gap-2 align-items-stretch">
            {% if user.is_authenticated %}
                <a class="p-2 btn btn-outline-primary text-nowrap d-flex align-items-center justify-content-center" href="{% url 'catalog:product_create' %}">Добавить товар</a>

                <a class="p-2 btn btn-outline-success text-nowrap d-flex align-items-center justify-content-center" href="{% url 'users:profile' %}" style="max-width: 250px;">
                    <span class="text-truncate">Профиль ({{ user.email }})</span>
                </a>

                <form action="{% url 'users:logout' %}" method="post" class="m-0 d-flex">
                    {% csrf_token %}
                    <button type="submit" class="p-2 btn btn-outline-danger text-nowrap d-flex align-items-center justify-content-center">Выйти</button>
                </form>
            {% else %}
                <a class="p-2 btn btn-outline-secondary text-nowrap d-flex align-items-center justify-content-center" href="{% url 'users:login' %}">Войти</a>
                <a class="p-2 btn btn-outline-primary text-nowrap d-flex align-items-center justify-content-center" href="{% url 'users:register' %}">Регистрация</a>
            {% endif %}
        </div>
