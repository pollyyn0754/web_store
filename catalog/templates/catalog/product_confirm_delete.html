{% extends 'catalog/base.html' %}

{% block title %}Удалить товар — Skystore{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Удалить товар?</h4>
                </div>
                <div class="card-body">
                    <p>Вы уверены, что хотите удалить «{{ object.name }}»?</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger w-100">Удалить</button>
                        <a href="{% url 'catalog:product_detail' object.pk %}"
                           class="btn btn-outline-secondary w-100 mt-2">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
